[package]
name = "paymandate"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
